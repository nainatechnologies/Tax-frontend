      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p1-bg)"/>
  <circle cx="450" cy="150" r="140" fill="#6366F1" opacity="0.25"/>
  <!-- UI Components Composition -->
  <g transform="translate(60, 40)">
    <rect width="480" height="320" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect width="480" height="44" rx="16" fill="#1E293B"/>
    <circle cx="24" cy="22" r="5" fill="#EF4444"/>
