    <circle cx="56" cy="22" r="5" fill="#10B981"/>
    <text x="80" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">Nexus Design System v4.0</text>
    
    <!-- Component Swatches -->
    <rect x="30" y="70" width="120" height="38" rx="8" fill="#2563EB"/>
    <text x="90" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Primary CTA</text>
    
    <rect x="170" y="70" width="120" height="38" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="230" y="94" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Secondary</text>
    
    <rect x="310" y="70" width="140" height="38" rx="19" fill="#0D9488" fill-opacity="0.2" stroke="#14B8A6"/>
