    <!-- Color Palette Row -->
    <circle cx="50" cy="150" r="18" fill="#2563EB"/>
    <circle cx="100" cy="150" r="18" fill="#0D9488"/>
    <circle cx="150" cy="150" r="18" fill="#8B5CF6"/>
    <circle cx="200" cy="150" r="18" fill="#F59E0B"/>
    <circle cx="250" cy="150" r="18" fill="#10B981"/>

    <rect x="30" y="195" width="420" height="90" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
    <text x="50" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">350+ Production Components</text>
