      <!-- Chart visualization -->
      <rect x="0" y="120" width="540" height="170" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="20" y="145" fill="#f8fafc" font-size="13" font-weight="700">5-Year Tax Savings Trajectory</text>
      
      <path d="M 40 250 Q 150 220 260 190 T 480 160" fill="none" stroke="#10b981" stroke-width="4"/>
      <circle cx="40" cy="250" r="5" fill="#10b981"/>
      <circle cx="150" cy="220" r="5" fill="#10b981"/>
      <circle cx="260" cy="190" r="5" fill="#10b981"/>
      <circle cx="370" cy="175" r="5" fill="#10b981"/>
