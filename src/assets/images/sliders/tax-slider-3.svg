<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="slider3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="60%" stop-color="#142c4c" />
      <stop offset="100%" stop-color="#0a1829" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#slider3_bg)"/>
  
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="600" height="380" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="600" height="42" rx="12" fill="#0f172a"/>
    <text x="30" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Tax Optimization &amp; Capital Gains Planner</text>
    
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="165" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="30" fill="#94a3b8" font-size="11">Old vs New Regime</text>
      <text x="15" y="60" fill="#38bdf8" font-size="18" font-weight="700">₹ 42,600</text>
      <text x="15" y="80" fill="#10b981" font-size="10">Saved via Comparison</text>
      
      <rect x="185" y="0" width="165" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="200" y="30" fill="#94a3b8" font-size="11">80C, 80D &amp; NPS</text>
      <text x="200" y="60" fill="#10b981" font-size="18" font-weight="700">₹ 2,00,000</text>
      <text x="200" y="80" fill="#cbd5e1" font-size="10">Deductions Claimed</text>
      
      <rect x="370" y="0" width="170" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
