<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <defs>
    <linearGradient id="s3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#s3-bg)"/>
  
  <circle cx="850" cy="300" r="220" fill="#10B981" opacity="0.25" filter="url(#blur3)"/>
  <circle cx="1050" cy="550" r="180" fill="#0EA5E9" opacity="0.2" filter="url(#blur3)"/>

  <!-- Enterprise Architecture 3D composition -->
  <g transform="translate(520, 160)">
    <!-- Base plate -->
    <rect width="600" height="480" rx="24" fill="#0F172A" fill-opacity="0.9" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.5))"/>
    
    <!-- Header -->
    <rect width="600" height="60" rx="24" fill="#1E293B"/>
    <text x="36" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">AI Workflow Orchestrator</text>
    <rect x="460" y="18" width="105" height="26" rx="13" fill="#10B981" fill-opacity="0.2"/>
    <text x="512" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34D399">Live Cluster</text>

    <!-- Node Network Visualization -->
    <g transform="translate(40, 90)">
      <!-- Node 1 -->
      <rect x="0" y="40" width="140" height="70" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
      <text x="20" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Data Ingestion</text>
      <text x="20" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">1.2 TB / sec</text>

      <!-- Node 2 -->
      <rect x="190" y="0" width="140" height="70" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="210" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Gemini Model</text>
      <text x="210" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Low Latency</text>

      <!-- Node 3 -->
      <rect x="190" y="110" width="140" height="70" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
      <text x="210" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Vector Index</text>
      <text x="210" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">99.9% Recall</text>

      <!-- Node 4 -->
      <rect x="380" y="55" width="140" height="70" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="400" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">API Response</text>
      <text x="400" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">18ms Latency</text>

      <!-- Connecting Lines -->
      <path d="M140 75 L190 35" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M140 75 L190 145" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M330 35 L380 90" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M330 145 L380 90" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 4"/>
    </g>

    <!-- Bottom Stat Bar -->
    <rect x="40" y="320" width="520" height="70" rx="12" fill="#1E293B"/>
    <text x="60" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">Monthly Requests</text>
    <text x="60" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">4.8 Billion</text>
    <text x="240" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">Global Regions</text>
    <text x="240" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">38 Edge Zones</text>
    <text x="420" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8">SLA Guarantee</text>
    <text x="420" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#34D399">99.99%</text>
  </g>
</svg>
